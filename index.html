<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      form {
        background-color: #c8bcff;
        height: 400px;
        width: 30%;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-evenly;
      }
      input,
      button {
        border: 0;
        border-radius: 20px;
        padding: 10px 20px;
        width: 80%;
      }
    </style>
  </head>
  <body>
    <form action="">
      <h2>Авторизация</h2>
      <input type="text" name="user" placeholder="Логин" />

      <input type="password" name="password" placeholder="Пароль" />

      <button type="button" class="btn">Войти</button>
    </form>

    <script src="script.js"></script>
  </body>
</html>
